<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Film Japanese</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
  background: linear-gradient(180deg, #11152c, #050713);
}

.container {
  max-width: 750px;
  margin: auto;
  padding: 20px;
}

/* VIDEO */
.video-box {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  background: black;
  border-radius: 25px;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 80px;
  height: 80px;
  border-radius: 50%;
  border: none;
  background: white;
  color: black;
  font-size: 35px;
  cursor: pointer;
}

/* TELEGRAM */
.telegram {
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  margin: 30px 0;
  padding: 28px 15px;
  border-radius: 28px;
  background: linear-gradient(120deg, #079bd7, #08c5f4);
  color: white;
  text-decoration: none;
  font-size: 25px;
  font-weight: bold;
}

/* CATEGORY */
.categories {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}

.card {
  text-align: center;
  padding: 20px 8px;
  border-radius: 25px;
  text-decoration: none;
  color: white;
  min-height: 280px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: 0.2s;
}

.card:hover {
  transform: translateY(-5px);
}

.japan {
  background: linear-gradient(145deg, #ff4168, #dc003f);
}

.indonesia {
  background: linear-gradient(145deg, #00e676, #00a84f);
}

.west {
  background: linear-gradient(145deg, #399bff, #1762dc);
}

.badge {
  font-size: 12px;
  font-weight: bold;
  background: #0003;
  border-radius: 20px;
  padding: 7px 10px;
}

.flag {
  font-size: 55px;
  margin: 15px 0;
}

.card h2 {
  font-size: 20px;
  margin: 5px 0;
}

.card p {
  font-size: 15px;
  margin: 8px 0;
}

.footer {
  text-align: center;
  color: #999;
  margin-top: 30px;
  font-size: 13px;
}

@media(max-width:480px) {
  .container {
    padding: 15px 12px;
  }

  .categories {
    gap: 10px;
  }

  .card {
    min-height: 250px;
    border-radius: 22px;
  }

  .flag {
    font-size: 43px;
  }

  .card h2 {
    font-size: 16px;
  }

  .card p {
    font-size: 13px;
  }

  .telegram {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="container">

  <!-- VIDEO -->
  <div class="video-box">

    <video id="video" controls playsinline preload="metadata">
      <source
        src="https://ik.imagekit.io/gaw1shzp8/ssstwitter.com_1793801843614.mp4?updatedAt=1793802399194"
        type="video2/mp4">
    </video>

    <button class="play-button" id="playButton">
      ▶
    </button>

  </div>

  <p style="text-align:center;color:#aaa">
    Video pilihan terbaru
  </p>

  <!-- TELEGRAM -->
  <a class="telegram"
     href="https://t.me/DailyFilmJapanese1"
     target="_blank"
     rel="noopener noreferrer">

    ✈ BERGABUNGLAH DENGAN TELEGRAM

  </a>

  <!-- KATEGORI -->
  <div class="categories">

    <!-- JEPANG -->
    <a class="card japan"
       href="https://auctionr.org/4/df7b205aadf9a4d6188119c934647e8d"
       target="_blank"
       rel="noopener noreferrer">

      <span class="badge">🔥 PANAS</span>

      <div class="flag">🇯🇵</div>

      <h2>JEPANG</h2>

      <p>Jepang</p>

      <p>Koleksi 1.2K</p>

    </a>

    <!-- INDONESIA -->
    <a class="card indonesia"
       href="https://auctionr.org/4/df7b205aadf9a4d6188119c934647e8d"
       target="_blank"
       rel="noopener noreferrer">

      <span class="badge">⭐ BARU</span>

      <div class="flag">🇮🇩</div>

      <h2>INDONESIA</h2>

      <p>Indonesia</p>

      <p>Koleksi 840</p>

    </a>

    <!-- BARAT -->
    <a class="card west"
       href="https://auctionr.org/4/31a71a88f5bfa411dd113c96e1b027e0"
       target="_blank"
       rel="noopener noreferrer">

      <span class="badge">💥 TERATAS</span>

      <div class="flag">🌍</div>

      <h2>BARAT</h2>

      <p>Barat</p>

      <p>Koleksi 2.1K</p>

    </a>

  </div>

  <div class="footer">
    Daily Film Japanese
  </div>

</div>

<script>
const video = document.getElementById("video");
const playButton = document.getElementById("playButton");

const adsterraLink =
"https://auctionr.org/4/df7b205aadf9a4d6188119c934647e8d";

let firstPlay = true;

playButton.addEventListener("click", function() {

  if (firstPlay) {

    firstPlay = false;

    // Buka iklan Adsterra pada klik play pertama
    window.open(
      adsterraLink,
      "_blank",
      "noopener,noreferrer"
    );

  }

  playButton.style.display = "none";

  video.play().catch(function() {
    playButton.style.display = "block";
  });

});

video.addEventListener("play", function() {
  playButton.style.display = "none";
});

video.addEventListener("pause", function() {
  if (video.currentTime === 0) {
    playButton.style.display = "block";
  }
});

</script>

</body>
</html>
