<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Viral</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:linear-gradient(145deg,#090d1e,#17102d);
 color:white;font-family:Arial,sans-serif;
}
main{max-width:760px;margin:auto;padding:20px 15px}
.video-wrap{position:relative;background:#000;border-radius:0 0 30px 30px;overflow:hidden}
video{width:100%;display:block;aspect-ratio:16/9;background:#000}
.play-cover{position:absolute;inset:0;display:grid;place-items:center}
.play-cover button{border:0;border-radius:50%;width:80px;height:80px;font-size:30px;cursor:pointer}
.hidden{display:none!important}
.note{text-align:center;color:#aaaebf;padding:12px}
.telegram{
 display:flex;align-items:center;justify-content:center;gap:20px;
 margin:30px 0 40px;padding:30px 12px;border-radius:35px;
 background:linear-gradient(110deg,#079bd4,#08b9ed);
 color:white;text-decoration:none;font-size:25px;font-weight:bold;
}
.telegram span:first-child{font-size:40px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.category{
 border:0;border-radius:30px;min-height:260px;padding:12px 5px;
 color:white;display:flex;flex-direction:column;
 align-items:center;cursor:pointer;
}
.jp{background:linear-gradient(145deg,#ff4769,#e90b42)}
.id{background:linear-gradient(145deg,#00e77a,#00a84e)}
.west{background:linear-gradient(145deg,#399cff,#1763dc)}
.tag{font-size:12px;background:#0003;padding:7px;border-radius:20px;align-self:flex-end}
.flag{font-size:55px;margin:15px 0}
.category strong{font-size:18px;margin-bottom:15px}
.country{font-size:16px;margin-bottom:15px}
.count{font-size:15px}
footer{text-align:center;color:#aaa;margin:35px 0}
@media(max-width:500px){
 .cards{gap:10px}
 .category{min-height:245px}
 .category strong{font-size:15px}
 .country,.count{font-size:13px}
 .telegram{font-size:20px}
}
</style>
</head>
<body>
<main>

<div class="video-wrap">
 <video id="video" playsinline preload="metadata" controls></video>
 <div class="play-cover" id="cover">
  <button id="startButton">▶</button>
 </div>
</div>

<div class="note" id="note">Tekan Play untuk menonton video</div>

<a class="telegram" id="telegram" target="_blank" rel="noopener noreferrer">
 <span>➤</span>
 <span>BERGABUNGLAH DENGAN<br>TELEGRAM</span>
</a>

<div class="cards">

<button class="category jp" data-category="jepang">
 <span class="tag">🔥 PANAS</span>
 <span class="flag">🇯🇵</span>
 <strong>JEPANG</strong>
 <span class="country">Jepang</span>
 <span class="count">Koleksi 1.2K</span>
</button>

<button class="category id" data-category="indonesia">
 <span class="tag">⭐ BARU</span>
 <span class="flag">🇮🇩</span>
 <strong>INDONESIA</strong>
 <span class="country">Indonesia</span>
 <span class="count">Koleksi 840</span>
</button>

<button class="category west" data-category="barat">
 <span class="tag">💥 TERATAS</span>
 <span class="flag">🌍</span>
 <strong>BARAT</strong>
 <span class="country">Barat</span>
 <span class="count">Koleksi 2.1K</span>
</button>

</div>

<footer>✣ Powered by Netlify</footer>
</main>

<script>
// LINK MILIK KAMU
const TELEGRAM_URL = "https://t.me/DailyFilmJapanese1";

const ADSTERRA_URL = "https://auctionr.org/4/df7b205aadf9a4d6188119c934647e8d";

const VIDEO_URL = "https://ik.imagekit.io/gaw1shzp8/ssstwitter.com_1794329606274.mp4?updatedAt=1794331664054";

// PASANG VIDEO
const video = document.getElementById("video");
const cover = document.getElementById("cover");
const note = document.getElementById("note");

video.src = VIDEO_URL;
document.getElementById("telegram").href = TELEGRAM_URL;

let firstPlay = true;
let waitingForAd = false;
let adTab = null;

function playVideo(){
 cover.classList.add("hidden");
 video.play().catch(()=>{
  cover.classList.remove("hidden");
  note.textContent="Video gagal diputar. Periksa link video.";
 });
}

// KLIK PLAY PERTAMA
document.getElementById("startButton").addEventListener("click",()=>{
 if(!firstPlay){
  playVideo();
  return;
 }

 firstPlay=false;

 // Buka tab iklan setelah 5 detik
 adTab=window.open("about:blank","_blank");

 playVideo();
 note.textContent="Video dimulai. Iklan akan dibuka dalam 5 detik...";

 setTimeout(()=>{
  video.pause();
  waitingForAd=true;

  if(adTab && !adTab.closed){
   adTab.location.href=ADSTERRA_URL;
   note.textContent="Silakan kembali ke tab ini setelah iklan.";
  }else{
   note.textContent="Popup diblokir. Izinkan popup browser.";
   cover.classList.remove("hidden");
  }
 },5000);
});

// LANJUTKAN VIDEO SAAT KEMBALI
document.addEventListener("visibilitychange",()=>{
 if(document.visibilityState==="visible" && waitingForAd){
  waitingForAd=false;
  playVideo();
 }
});

window.addEventListener("focus",()=>{
 if(waitingForAd){
  waitingForAd=false;
  playVideo();
 }
});

// KLIK KATEGORI
document.querySelectorAll(".category").forEach(button=>{
 button.addEventListener("click",()=>{
  window.location.href=ADSTERRA_URL;
 });
});

video.addEventListener("ended",()=>{
 cover.classList.remove("hidden");
 note.textContent="Video selesai. Tekan Play untuk menonton lagi.";
});

</script>
</body>
</html>
