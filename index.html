<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080b19">
<title>Video Viral</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 font-family:Arial,sans-serif;
 color:white;
 background:radial-gradient(ellipse at 50% 35%,#29205b,#10152d 48%,#070b17);
}
.page{
 width:min(100%,720px);
 margin:auto;
 padding:24px 20px 38px;
}
.brand{
 width:112px;height:112px;
 margin:0 auto 18px;
 border-radius:50%;
 background:white;
 display:grid;
 place-items:center;
 color:#111;
 font-size:38px;
 font-weight:900;
}
.video-wrap{
 position:relative;
 overflow:hidden;
 border-radius:0 0 38px 38px;
 background:black;
}
video{
 display:block;
 width:100%;
 max-height:72vh;
 aspect-ratio:9/16;
 object-fit:cover;
 background:black;
}
.play-cover{
 position:absolute;
 inset:0;
 display:grid;
 place-items:center;
 background:#0003;
 cursor:pointer;
}
.play-button{
 width:82px;height:82px;
 border:0;
 border-radius:50%;
 background:#ffffffed;
 color:#111;
 font-size:32px;
 cursor:pointer;
}
.hint{
 font-size:12px;
 text-align:center;
 color:#c7c9df;
 margin:10px 0 28px;
}
.telegram{
 display:flex;
 align-items:center;
 justify-content:center;
 gap:18px;
 width:100%;
 min-height:150px;
 padding:24px;
 border-radius:42px;
 text-decoration:none;
 color:white;
 font-size:clamp(22px,5vw,34px);
 font-weight:800;
 line-height:1.25;
 background:linear-gradient(115deg,#079bd4,#12c5ef);
 margin-bottom:40px;
}
.telegram svg{width:58px;height:58px;flex:none;fill:white}
.categories{
 display:grid;
 grid-template-columns:repeat(3,minmax(0,1fr));
 gap:16px;
}
.category{
 min-height:300px;
 border-radius:34px;
 color:white;
 text-decoration:none;
 display:flex;
 flex-direction:column;
 align-items:center;
 padding:18px 8px 22px;
 box-shadow:0 12px 28px #0005;
}
.hot{background:linear-gradient(145deg,#ff456c,#e90045)}
.new{background:linear-gradient(145deg,#08df78,#00a94c)}
.west{background:linear-gradient(145deg,#399bff,#1764ed)}
.tag{
 font-size:14px;
 font-weight:800;
 background:#0003;
 padding:8px 12px;
 border-radius:30px;
}
.emoji{font-size:66px;margin:12px 0 18px}
.category strong{
 font-size:clamp(16px,3.5vw,23px);
 margin-bottom:18px;
}
.category span:last-child{font-size:17px}
.footer{
 text-align:center;
 color:#9ba1bd;
 font-size:14px;
 margin-top:40px;
}
@media(max-width:390px){
 .page{padding:16px 14px 30px}
 .categories{gap:10px}
 .category{min-height:260px;border-radius:26px;padding:14px 5px}
 .tag{font-size:11px;padding:7px 8px}
 .emoji{font-size:52px}
 .category span:last-child{font-size:14px}
}
</style>
</head>

<body>
<main class="page">

<div class="brand">▶</div>

<section class="video-wrap">
<video id="mainVideo" controls playsinline preload="metadata">
<source src="https://ik.imagekit.io/gaw1shzp8/ssstwitter.com_1794329606274.mp4?updatedAt=1794331664054" type="video/mp4">
Browser tidak mendukung video.
</video>

<div class="play-cover" id="playCover">
<button class="play-button">▶</button>
</div>
</section>

<p class="hint">Tekan tombol play untuk menonton video</p>

<a class="telegram"
href="https://t.me/DailyFilmJapanese1"
target="_blank">
<svg viewBox="0 0 24 24">
<path d="M21.7 4.3 18.5 20c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.7l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6L20 3.1c.9-.3 1.9.2 1.7 1.2Z"/>
</svg>
<span>BERGABUNGLAH DENGAN<br>TELEGRAM</span>
</a>

<section class="categories">

<a class="category hot"
href="https://auctionr.org/4/31a71a88f5bfa411dd113c96e1b027e0"
target="_blank">
<span class="tag">🔥 PANAS</span>
<span class="emoji">🇯🇵</span>
<strong>JEPANG</strong>
<span>Koleksi 1.2K</span>
</a>

<a class="category new"
href="https://auctionr.org/4/31a71a88f5bfa411dd113c96e1b027e0"
target="_blank">
<span class="tag">⭐ BARU</span>
<span class="emoji">🇮🇩</span>
<strong>INDONESIA</strong>
<span>Koleksi 840</span>
</a>

<a class="category west"
href="https://auctionr.org/4/31a71a88f5bfa411dd113c96e1b027e0"
target="_blank">
<span class="tag">💥 TERATAS</span>
<span class="emoji">🌍</span>
<strong>BARAT</strong>
<span>Koleksi 2.1K</span>
</a>

</section>

<p class="footer">Video <span id="duration">—</span></p>

</main>

<script>
const video = document.getElementById('mainVideo');
const cover = document.getElementById('playCover');

const adUrl =
'https://auctionr.org/4/31a71a88f5bfa411dd113c96e1b027e0';

let firstPlay = true;

cover.addEventListener('click', () => {

 if (!firstPlay) {
   video.play();
   cover.style.display = 'none';
   return;
 }

 let adTab = null;

 try {
   adTab = window.open('about:blank','_blank');
 } catch(e) {}

 firstPlay = false;
 cover.style.display = 'none';

 video.play().catch(() => {
   cover.style.display = 'grid';
   firstPlay = true;
   if(adTab && !adTab.closed) adTab.close();
 });

 setTimeout(() => {
   if(adTab && !adTab.closed) {
     adTab.location.href = adUrl;
   }
 },3000);

});

video.addEventListener('play', () => {
 cover.style.display = 'none';
});

video.addEventListener('loadedmetadata', () => {
 const total = Math.floor(video.duration || 0);
 document.getElementById('duration').textContent =
 Math.floor(total/60) + ':' +
 String(total%60).padStart(2,'0');
});
</script>

</body>
</html>
